[project]
name = "iceguard"
version = "0.1.0"
description = "Data reuse, lineage and cost governance for analytical databases, exposed over MCP."
readme = "README.md"
authors = [
    { name = "rushikesh0022", email = "rushionline18@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=1.11.0",
    "fastmcp>=4.1.0",
    "pydantic>=2.14.1",
    "sqlglot>=30.23.0",
]

[project.scripts]
iceguard-mcp = "iceguard.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local ClickHouse server (skipped when it is not running)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
